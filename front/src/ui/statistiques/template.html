<section class="mb-6 rounded-lg border border-border-default p-6 shadow-xs">
  <h2 class="mb-5 text-base font-semibold tracking-tight">Statistiques du catalogue</h2>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div class="rounded-md border border-border-default p-4">
      <div class="text-2xl leading-tight font-semibold tracking-tight">{{total}}</div>
      <div class="text-sm text-fg-muted">produits</div>
    </div>
    <div class="rounded-md border border-border-default p-4">
      <div class="text-2xl leading-tight font-semibold tracking-tight">{{stockTotal}}</div>
      <div class="text-sm text-fg-muted">pots en stock</div>
    </div>
    <div class="rounded-md border border-border-default p-4">
      <div class="text-2xl leading-tight font-semibold tracking-tight">{{prixMoyen}}</div>
      <div class="text-sm text-fg-muted">prix moyen</div>
    </div>
  </div>

  <ul class="mt-6 divide-y divide-border-default text-sm">
    <slot name="categories"></slot>
  </ul>
</section>
