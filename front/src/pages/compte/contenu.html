<div class="flex flex-col gap-8">
  <section aria-labelledby="infos-titre" class="flex flex-col gap-3">
    <h2 id="infos-titre" class="text-lg leading-snug font-bold">Mes informations</h2>
    <dl class="grid gap-4 rounded-lg border border-border-default bg-bg-default p-6 sm:grid-cols-3">
      <div class="flex flex-col gap-1">
        <dt class="text-xs text-fg-muted">Nom</dt>
        <dd class="text-sm break-words">{{nom}}</dd>
      </div>
      <div class="flex flex-col gap-1">
        <dt class="text-xs text-fg-muted">E-mail</dt>
        <dd class="text-sm break-all">{{email}}</dd>
      </div>
      <div class="flex flex-col gap-1">
        <dt class="text-xs text-fg-muted">Client depuis le</dt>
        <dd class="text-sm">{{depuis}}</dd>
      </div>
    </dl>
    <a href="/compte/profil" data-link class="flex min-h-10 w-fit items-center rounded-md border border-border-default px-4 text-sm font-medium transition-colors hover:bg-bg-subtle">Modifier mon profil</a>
  </section>

  <slot name="apercu"></slot>
</div>
