<header class="sticky top-0 z-10 border-b border-border-default bg-bg-default">
  <div class="conteneur flex flex-wrap items-center gap-x-8 gap-y-2 py-4">
    <a href="/" data-link class="text-base font-bold tracking-tight text-fg-brand">Ben &amp; Jerry's</a>

    <!-- Le routeur pose aria-current="page" sur le lien de la page affichée. -->
    <nav class="mr-auto flex gap-6 text-sm">
      <a href="/" data-link class="text-fg-default transition-colors hover:underline aria-[current=page]:font-semibold">Nos glaces</a>
    </nav>

    <a href="/panier" data-link data-panier-lien aria-label="{{libelle}}" class="flex min-h-10 items-center gap-1 text-fg-default">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5.5 8H18.5L17.5 21H6.5L5.5 8Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M9 8V7C9 6.20435 9.31607 5.44129 9.87868 4.87868C10.4413 4.31607 11.2044 4 12 4C12.7956 4 13.5587 4.31607 14.1213 4.87868C14.6839 5.44129 15 6.20435 15 7V8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <!-- Le chiffre est masqué quand le panier est vide (attribut hidden). -->
      <span data-panier-compteur {{masque}} class="min-w-[18px] rounded-full bg-bg-brand px-1 py-0.5 text-center text-[11px] leading-[1.3] font-medium text-fg-on-brand">{{nombre}}</span>
    </a>

    <!-- Mène à la connexion ; la page affiche « connecté » si une session est ouverte. -->
    <a href="/connexion" data-link aria-label="Mon compte" class="flex min-h-10 min-w-10 items-center justify-center text-fg-default">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" />
        <path d="M4 21C4 17.134 7.58172 14 12 14C16.4183 14 20 17.134 20 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>

    <button type="button" data-action="theme" aria-label="Changer de thème" class="h-8 rounded-md border border-border-default px-3 text-sm font-medium transition-colors hover:bg-bg-subtle">
      Thème
    </button>
  </div>
</header>
