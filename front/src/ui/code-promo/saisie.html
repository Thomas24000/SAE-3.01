<form novalidate class="flex flex-col gap-2 sm:flex-row sm:items-end">
  <label class="flex flex-1 flex-col gap-1 text-sm font-medium">
    Tu as un code ?
    <input name="code" type="text" value="{{saisie}}" maxlength="30" autocomplete="off" autocapitalize="characters" spellcheck="false" class="h-11 rounded-md border border-border-default bg-bg-default px-3 font-normal uppercase transition-colors hover:border-border-strong" />
  </label>
  <button type="submit" aria-disabled="{{enCours}}" class="flex min-h-11 items-center justify-center rounded-md border border-border-default px-4 text-sm font-medium transition-colors hover:bg-bg-subtle aria-disabled:cursor-not-allowed aria-disabled:opacity-60">{{libelle}}</button>
</form>
