<form novalidate class="flex flex-col gap-4 rounded-lg border border-border-default bg-bg-default p-6">
  <label class="flex flex-col gap-2 text-sm font-medium">
    Nom
    <input name="nom" type="text" autocomplete="name" maxlength="100" value="{{nom}}" aria-describedby="aide-nom" class="h-10 rounded-md border border-border-default bg-bg-default px-3 font-normal transition-colors hover:border-border-strong" />
    <span id="aide-nom" class="text-xs font-normal text-fg-muted">Facultatif, 100 caractères maximum.</span>
  </label>

  <label class="flex flex-col gap-2 text-sm font-medium">
    E-mail
    <input name="email" type="email" autocomplete="email" value="{{email}}" aria-describedby="aide-email" class="h-10 rounded-md border border-border-default bg-bg-default px-3 font-normal transition-colors hover:border-border-strong" />
    <span id="aide-email" class="text-xs font-normal text-fg-muted">C'est aussi ton identifiant de connexion.</span>
  </label>

  <button type="submit" class="mt-1 flex min-h-12 w-full items-center justify-center rounded-md bg-bg-brand px-6 py-3 leading-tight font-semibold text-fg-on-brand hover:opacity-90 sm:w-fit">Enregistrer</button>
</form>
