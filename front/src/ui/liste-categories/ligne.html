<li class="flex flex-col gap-2 p-4 md:flex-row md:items-center md:gap-4">
  <p class="text-sm font-semibold md:w-50">{{libelle}}</p>
  <p class="text-sm text-fg-muted md:min-w-0 md:flex-1 md:truncate">{{description}}</p>
  <p class="text-sm md:w-30">{{produits}}</p>
  <div class="flex gap-1 md:w-22">
    <a href="{{href}}" data-link title="Modifier" aria-label="Modifier la catégorie {{libelle}}" class="flex size-10 items-center justify-center rounded-md transition-colors hover:bg-bg-subtle">
      <img src="{{images}}crayon.svg" alt="" width="18" height="18" class="size-4.5 dark:invert" />
    </a>
    <button type="button" data-action="supprimer" data-id="{{id}}" title="Supprimer" aria-label="Supprimer la catégorie {{libelle}}" class="flex size-10 items-center justify-center rounded-md transition-colors hover:bg-bg-subtle">
      <img src="{{images}}corbeille.svg" alt="" width="18" height="18" class="size-4.5 dark:invert" />
    </button>
  </div>
</li>
