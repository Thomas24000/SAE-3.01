<form novalidate class="flex flex-col gap-4 rounded-lg border border-border-default bg-bg-default p-6">
  <label class="flex flex-col gap-2 text-sm font-medium">
    Identifiant
    <input name="login" type="text" autocomplete="username" value="{{login}}" aria-describedby="aide-login" class="h-10 rounded-md border border-border-default bg-bg-default px-3 font-normal transition-colors hover:border-border-strong" />
    <span id="aide-login" class="text-xs font-normal text-fg-muted">3 à 40 caractères : lettres, chiffres, point, tiret ou souligné.</span>
  </label>

  <label class="flex flex-col gap-2 text-sm font-medium">
    Mot de passe
    <input name="mdp" type="password" autocomplete="new-password" aria-describedby="aide-mdp" class="h-10 rounded-md border border-border-default bg-bg-default px-3 font-normal transition-colors hover:border-border-strong" />
    <span id="aide-mdp" class="text-xs font-normal text-fg-muted">8 caractères minimum.</span>
  </label>

  <label class="flex flex-col gap-2 text-sm font-medium">
    Confirmer le mot de passe
    <input name="confirmation" type="password" autocomplete="new-password" class="h-10 rounded-md border border-border-default bg-bg-default px-3 font-normal transition-colors hover:border-border-strong" />
  </label>

  <button type="submit" class="mt-1 flex min-h-12 w-full items-center justify-center rounded-md bg-bg-brand px-6 py-3 leading-[1.2] font-semibold text-fg-on-brand hover:opacity-90">Créer mon compte</button>

  <p class="text-sm text-fg-muted">
    Déjà un compte ?
    <button type="button" data-action="connexion" class="inline-flex min-h-10 items-center font-semibold text-fg-brand underline">Se connecter</button>
  </p>
</form>
