<aside aria-labelledby="validation-titre" class="flex flex-col gap-3 rounded-lg border border-border-default bg-bg-default p-6">
  <h2 id="validation-titre" class="text-lg leading-[1.3] font-bold">Ma commande</h2>

  <dl class="flex flex-col gap-3">
    <div class="flex items-center justify-between gap-2 text-sm leading-[1.45]">
      <dt>Retrait en magasin</dt>
      <dd>Gratuit</dd>
    </div>
    <div class="flex items-center justify-between gap-2 text-lg leading-[1.3] font-bold">
      <dt>Total</dt>
      <dd>{{total}}</dd>
    </div>
  </dl>

  <p class="text-xs leading-[1.4] text-fg-muted">Commande passée avec le compte {{email}}.</p>

  <button type="button" data-action="confirmer" aria-disabled="{{enCours}}" class="mt-1 flex min-h-12 w-full items-center justify-center rounded-md bg-bg-brand px-6 py-3 leading-[1.2] font-semibold text-fg-on-brand hover:opacity-90 aria-disabled:cursor-not-allowed aria-disabled:opacity-60">{{libelle}}</button>
  <p class="text-xs leading-[1.4] text-fg-muted">Ton panier sera vidé une fois la commande confirmée.</p>
</aside>
