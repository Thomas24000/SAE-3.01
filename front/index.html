<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAE301-Starter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/src/global.css" />

    <!--
      Application du thème avant le premier affichage. Script ordinaire et non
      module : le navigateur l'exécute avant de dessiner la page, qui
      n'apparaît donc jamais, même brièvement, dans le mauvais thème.
      Le thème est conservé en localStorage : le serveur n'en a pas besoin.
    -->
    <script>
      try {
        if (localStorage.getItem("theme") === "sombre") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch (e) {
        // localStorage indisponible : on reste en thème clair.
      }
    </script>
  </head>
  <body class="bg-bg-default text-fg-default antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
