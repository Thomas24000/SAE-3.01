<form novalidate class="flex flex-col gap-4 rounded-lg border border-border-default bg-bg-default p-6">
  <label class="flex flex-col gap-2 text-sm font-medium">
    E-mail
    <input name="email" type="email" autocomplete="email" value="{{email}}" class="h-10 rounded-md border border-border-default bg-bg-default px-3 font-normal transition-colors hover:border-border-strong" />
  </label>

  <label class="flex flex-col gap-2 text-sm font-medium">
    Mot de passe
    <input name="mdp" type="password" autocomplete="current-password" class="h-10 rounded-md border border-border-default bg-bg-default px-3 font-normal transition-colors hover:border-border-strong" />
  </label>

  <button type="submit" class="mt-1 flex min-h-12 w-full items-center justify-center rounded-md bg-bg-brand px-6 py-3 leading-[1.2] font-semibold text-fg-on-brand hover:opacity-90">Se connecter</button>

  <p class="text-sm text-fg-muted">
    Pas encore de compte ?
    <button type="button" data-action="inscription" class="inline-flex min-h-10 items-center font-semibold text-fg-brand underline">Créer un compte</button>
  </p>
</form>
