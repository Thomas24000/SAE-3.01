<label data-depot class="flex cursor-pointer flex-col items-center gap-2 rounded-lg border border-dashed border-border-default bg-bg-default p-6 text-center transition-colors hover:border-border-strong has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-border-focus aria-disabled:cursor-not-allowed aria-disabled:opacity-60" aria-disabled="{{enCours}}">
  <img src="{{images}}televerser.svg" alt="" width="28" height="28" class="size-7 dark:brightness-0 dark:invert" />
  <span class="text-sm font-semibold">{{titre}}</span>
  <span class="text-xs text-fg-muted">JPG, PNG ou WebP · 5 Mo max par image · redimensionnées automatiquement (1200 × 1200 px + miniatures)</span>
  <input type="file" name="fichiers" accept="image/jpeg,image/png,image/webp" multiple {{desactive}} class="sr-only" />
</label>
