<header class="hidden items-center gap-4 border-b border-border-default bg-bg-default px-6 py-4 md:flex lg:px-8">
  <p class="flex-1 text-sm font-semibold">{{section}}</p>
  <div class="flex items-center gap-2">
    <p class="max-w-48 truncate text-sm lg:max-w-80">{{email}}</p>
    <span class="rounded-full bg-bg-accent px-2 py-0.5 text-[11px] font-medium text-fg-brand">Admin</span>
    <img src="{{avatar}}" alt="" width="32" height="32" class="size-8 dark:invert" />
  </div>
</header>
