<li class="flex items-center gap-3 py-4 md:gap-4">
  <div class="bandeau-clair dark:bandeau-sombre size-16 shrink-0 overflow-hidden rounded-md border border-border-default md:size-24" style="--teinte: {{teinte}}">
    <img src="{{image}}" alt="Pot de glace {{nom}}" width="96" height="96" loading="lazy" class="size-full object-cover" />
  </div>

  <div class="flex min-w-0 flex-1 flex-col gap-1">
    <a href="/produit/{{slug}}" data-link class="text-sm font-semibold hover:underline md:text-base md:font-bold">{{nom}}</a>
    <p class="text-xs text-fg-muted">{{libelle}}</p>
    <p {{optionsCachees}} class="text-xs text-fg-muted">{{optionsTexte}}</p>
    <button type="button" data-variante-id="{{id}}" data-options="{{cle}}" data-action="modifier" {{modifierCache}} class="min-h-10 w-fit text-xs text-fg-muted hover:underline">Modifier les options</button>
    <slot name="edition"></slot>

    <div class="flex flex-col items-start gap-2 pt-1 sm:flex-row sm:items-center sm:gap-4">
      <div role="group" aria-label="Quantité de {{nom}}" class="flex min-h-10 w-fit items-center gap-3 rounded-md border border-border-default px-2 py-1">
        <button type="button" data-variante-id="{{id}}" data-options="{{cle}}" data-quantite-delta="-1" aria-label="Diminuer la quantité de {{nom}}" {{moinsDesactive}} class="flex size-8 items-center justify-center leading-none disabled:cursor-not-allowed disabled:opacity-40">−</button>
        <output aria-live="polite" class="w-5 text-center text-sm leading-[1.45] font-semibold">{{quantite}}</output>
        <button type="button" data-variante-id="{{id}}" data-options="{{cle}}" data-quantite-delta="1" aria-label="Augmenter la quantité de {{nom}}" {{plusDesactive}} class="flex size-8 items-center justify-center leading-none disabled:cursor-not-allowed disabled:opacity-40">+</button>
      </div>
      <button type="button" data-variante-id="{{id}}" data-options="{{cle}}" data-action="supprimer" aria-label="Supprimer {{nom}} du panier" class="min-h-10 text-xs text-fg-muted hover:underline">Supprimer</button>
    </div>
    <p {{alerteStock}} class="text-xs leading-[1.4] font-semibold text-fg-muted">Stock maximum atteint</p>
  </div>

  <p class="shrink-0 text-right text-base leading-snug font-bold"><slot name="prix"></slot></p>
</li>
