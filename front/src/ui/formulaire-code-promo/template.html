<section class="flex w-full max-w-160 flex-col gap-5 rounded-lg border border-border-default bg-bg-default p-4 md:p-6">
  <h2 class="text-lg leading-tight font-bold">Informations</h2>

  <slot name="message"></slot>

  <form novalidate class="flex flex-col gap-5">
    <label class="flex flex-col gap-2 text-sm">
      Code *
      <input name="code" type="text" maxlength="30" required autocomplete="off" autocapitalize="characters" spellcheck="false" value="{{code}}" {{codeFige}} class="h-12 rounded-md border border-border-default bg-bg-default px-3 text-base uppercase transition-colors hover:border-border-strong read-only:bg-bg-subtle read-only:text-fg-muted" />
      <span class="text-xs text-fg-muted">{{aideCode}}</span>
    </label>

    <label class="flex flex-col gap-2 text-sm">
      Remise (%) *
      <input name="pourcentage" type="number" inputmode="numeric" min="1" max="100" step="1" required value="{{pourcentage}}" class="h-12 rounded-md border border-border-default bg-bg-default px-3 text-base transition-colors hover:border-border-strong" />
      <span class="text-xs text-fg-muted">Un nombre entier de 1 à 100, appliqué au total de la commande.</span>
    </label>

    <label class="flex min-h-10 items-center gap-3 text-sm">
      <input name="actif" type="checkbox" {{actifCoche}} class="size-5 accent-bg-brand" />
      Code actif (accepté à la commande)
    </label>

    <div class="flex flex-col gap-3 sm:flex-row sm:justify-end">
      <a href="/admin/codes-promo" data-link class="flex min-h-12 items-center justify-center rounded-md border border-border-strong px-6 py-3 leading-tight font-semibold transition-colors hover:bg-bg-subtle">Annuler</a>
      <button type="submit" class="flex min-h-12 items-center justify-center rounded-md bg-bg-brand px-6 py-3 leading-tight font-semibold text-fg-on-brand hover:opacity-90 aria-disabled:cursor-not-allowed aria-disabled:opacity-60" aria-disabled="{{enCours}}">{{bouton}}</button>
    </div>
  </form>
</section>
