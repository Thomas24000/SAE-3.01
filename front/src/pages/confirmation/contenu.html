<div class="mx-auto flex max-w-2xl flex-col gap-6">
  <header class="flex flex-col items-start gap-3">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-700 dark:text-green-400">
      <circle cx="12" cy="12" r="10" />
      <path d="m8 12.5 3 3 5-6" />
    </svg>
    <h1 data-titre tabindex="-1" class="text-2xl font-bold tracking-tight focus:outline-none md:text-3xl">Merci, ta commande est confirmée !</h1>
    <p class="text-fg-muted">Nous préparons tes glaces. Tu pourras les retirer en magasin.</p>
  </header>

  <dl class="grid gap-4 rounded-lg border border-border-default bg-bg-default p-6 sm:grid-cols-2">
    <div class="flex flex-col gap-1">
      <dt class="text-xs text-fg-muted">Numéro de commande</dt>
      <dd class="text-lg leading-snug font-bold">{{numero}}</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="text-xs text-fg-muted">Statut</dt>
      <dd class="text-base leading-snug font-semibold">{{statut}}</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="text-xs text-fg-muted">Date</dt>
      <dd class="text-sm">{{date}}</dd>
    </div>
    <div class="flex flex-col gap-1">
      <dt class="text-xs text-fg-muted">Compte</dt>
      <dd class="text-sm break-all">{{email}}</dd>
    </div>
    <div class="flex flex-col gap-1 sm:col-span-2">
      <dt class="text-xs text-fg-muted">Mode de retrait</dt>
      <dd class="text-sm">Retrait en magasin (gratuit)</dd>
    </div>
  </dl>

  <section aria-labelledby="detail-titre" class="flex flex-col gap-2">
    <h2 id="detail-titre" class="text-lg leading-snug font-bold">Détail de la commande</h2>
    <ul class="flex flex-col divide-y divide-border-default border-y border-border-default">
      <slot name="lignes"></slot>
    </ul>
    <p class="flex items-center justify-between gap-2 pt-2 text-lg leading-snug font-bold">
      <span>Total</span>
      <span>{{total}}</span>
    </p>
  </section>

  <a href="/" data-link class="flex min-h-12 w-full items-center justify-center rounded-md bg-bg-brand px-6 py-3 font-semibold text-fg-on-brand hover:opacity-90 sm:w-fit">Continuer mes achats</a>
</div>
