<section class="mb-6 rounded-lg border border-border-default p-6 shadow-xs">
  <h2 class="mb-5 text-base font-semibold tracking-tight">Connexion</h2>

  <form class="flex flex-col gap-4">
    <label class="flex flex-col gap-2 text-sm font-medium">
      E-mail
      <input name="login" type="text" autocomplete="username" value="{{login}}" class="h-9 rounded-md border border-border-default bg-bg-default px-3 font-normal transition-colors hover:border-border-strong" />
    </label>

    <label class="flex flex-col gap-2 text-sm font-medium">
      Mot de passe
      <input name="mdp" type="password" autocomplete="current-password" class="h-9 rounded-md border border-border-default bg-bg-default px-3 font-normal transition-colors hover:border-border-strong" />
    </label>

    <div class="flex flex-wrap gap-3">
      <button type="submit" class="h-9 rounded-md bg-bg-inverse px-4 text-sm font-medium text-fg-inverse transition-opacity hover:opacity-90">
        Se connecter
      </button>
      <!-- type « button » et non « submit » : ce bouton n'envoie pas le formulaire. -->
      <button type="button" data-action="deconnexion" class="h-9 rounded-md border border-border-default px-4 text-sm font-medium transition-colors hover:bg-bg-subtle">
        Se déconnecter
      </button>
    </div>
  </form>
</section>
