<article class="flex flex-col gap-2" data-produit="{{slug}}">
  <a href="/produit/{{slug}}" data-link aria-label="{{nom}}" class="bandeau-clair dark:bandeau-sombre block aspect-[4/3] overflow-hidden rounded-md sm:aspect-auto sm:h-60" style="--teinte: {{teinte}}">
    <img src="{{image}}" alt="Pot de glace {{nom}}" width="400" height="300" loading="lazy" class="size-full object-cover" />
  </a>

  <div class="flex flex-col gap-1">
    <h3 class="text-lg leading-[1.3] font-bold">
      <a href="/produit/{{slug}}" data-link class="hover:underline">{{nom}}</a>
    </h3>
    <p class="text-sm leading-[1.45] text-fg-muted">dès {{prix}}</p>
    <slot name="badge"></slot>
  </div>

  <slot name="action"></slot>
</article>
