<li>
  <!-- Le routeur pose aria-current="page" sur le lien de la page affichée. -->
  <a href="{{href}}" data-link title="{{libelle}}" class="group flex items-center gap-3 rounded-md px-4 py-3 text-sm transition-colors hover:underline md:justify-center md:p-3 lg:justify-start lg:px-4 aria-[current=page]:bg-bg-highlight aria-[current=page]:font-semibold aria-[current=page]:text-fg-on-highlight">
    <img src="{{icone}}" alt="" width="20" height="20" class="size-5 shrink-0 brightness-0 invert group-aria-[current=page]:invert-0 dark:invert-0" />
    <span class="md:sr-only lg:not-sr-only">{{libelle}}</span>
  </a>
</li>
